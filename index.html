<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assests/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operating Media – digitize your career® | LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700;1,800&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Dancing+Script:wght@600;700&family=Alex+Brush&family=Allura&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('om_lms_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-amber-100 selection:text-amber-900 dark:selection:bg-blue-900/60 dark:selection:text-blue-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
