name: Deploy Operating Media LMS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VPS_HOST || '72.62.192.224' }}
          username: ${{ secrets.SERVER_USER || secrets.VPS_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.VPS_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment for operatingM-lms on VPS..."
            cd /root/operatingM-lms
            git checkout -- package-lock.json || true
            git pull origin main
            npm install
            npm run build
            mkdir -p /var/www/operatingM-lms/dist
            rm -rf /var/www/operatingM-lms/dist/*
            cp -r dist/* /var/www/operatingM-lms/dist/
            chown -R www-data:www-data /var/www/operatingM-lms
            systemctl reload nginx
            echo "✅ operatingM-lms deployed successfully to lms.operatingmedia.org!"
